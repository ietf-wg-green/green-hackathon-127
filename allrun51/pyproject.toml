[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-allrun51"
version = "0.1.0"
requires-python = "==3.11.*"

[project.optional-dependencies]
test = ["pytest>=8", "pyang>=2.6.1", "ncclient>=0.6.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=runtime/pytest-tmp"

[tool.pyright]
extraPaths = ["src"]